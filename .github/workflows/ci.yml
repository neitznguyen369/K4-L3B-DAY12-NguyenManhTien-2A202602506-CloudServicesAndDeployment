name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: fake://

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t day12-agent:ci .

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Deploy to Railway
        run: npx --yes @railway/cli@latest up --ci --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      - name: Smoke test
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS "$PUBLIC_URL/health" && curl -fsS "$PUBLIC_URL/ready"; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not become healthy and ready in time." >&2
          exit 1
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
